name: Synthetic Recipient Trust Continuity Gate
on:
  pull_request:
    paths:
      - 'src/forexpro_ri/core_policy_preview.py'
      - 'src/forexpro_ri/synthetic_trust_continuity.py'
      - 'src/forexpro_ri/synthetic_trust_cli.py'
      - 'src/forexpro_ri/cli.py'
      - 'tests/test_synthetic_trust_continuity.py'
      - 'docs/SYNTHETIC_RECIPIENT_TRUST_CONTINUITY_V28.md'
      - '.github/workflows/synthetic-receiver-trust.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recipient-trust-synthetic-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install FRI
        run: python -m pip install -e .
      - name: Run synthetic recipient policy and trust continuity negative tests
        env:
          PYTHONPATH: src
        run: |
          python -m unittest discover -s tests -p test_core_policy_preview.py -v
          python -m unittest discover -s tests -p test_synthetic_trust_continuity.py -v
