name: Public-safe CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Synthetic-only unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Synthetic-only example CLI
        env:
          PYTHONPATH: src
        run: python -m forexpro_ri.cli examples/closed_synthetic
