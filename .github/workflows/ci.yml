name: Public-safe CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install FRI and Ed25519 verification dependency
        run: python -m pip install -e .
      - name: Synthetic-only unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Synthetic-only example CLI
        env:
          PYTHONPATH: src
        run: python -m forexpro_ri.cli examples/closed_synthetic
      - name: Synthetic-only Research Memory lifecycle
        env:
          PYTHONPATH: src
        run: |
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          python -m forexpro_ri.cli memory ingest examples/closed_synthetic --db "$tmpdir/memory.sqlite" --unsigned-synthetic
          python -m forexpro_ri.cli memory patterns --db "$tmpdir/memory.sqlite"
          python -m forexpro_ri.cli memory verify --db "$tmpdir/memory.sqlite"
      - name: Synthetic-only Failure Intelligence smoke
        env:
          PYTHONPATH: src
        run: |
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          python -m forexpro_ri.cli memory ingest examples/closed_synthetic --db "$tmpdir/memory.sqlite" --unsigned-synthetic
          python -m forexpro_ri.cli memory intelligence --db "$tmpdir/memory.sqlite" --focus SYNTHETIC-001

      - name: Synthetic-only signed bridge E2E rehearsal
        env:
          PYTHONPATH: src
        run: python -m forexpro_ri.cli bridge rehearsal

      - name: Synthetic-only cohort comparison CLI (v0.6)
        env:
          PYTHONPATH: src
        run: |
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          python -m forexpro_ri.cli memory ingest examples/closed_synthetic --db "$tmpdir/memory.sqlite" --unsigned-synthetic
          python -m forexpro_ri.cli memory ingest examples/closed_synthetic_peer --db "$tmpdir/memory.sqlite" --unsigned-synthetic
          python -m forexpro_ri.cli memory compare --db "$tmpdir/memory.sqlite" --experiment SYNTHETIC-001 --experiment SYNTHETIC-002 --expected-procedure REGIME_STABILITY --format json
          python -m forexpro_ri.cli memory compare --db "$tmpdir/memory.sqlite" --experiment SYNTHETIC-002 --experiment SYNTHETIC-001 --expected-procedure REGIME_STABILITY --format markdown
          python -m forexpro_ri.cli memory verify --db "$tmpdir/memory.sqlite"

      - name: Synthetic-only Research Dossier (v0.7)
        env:
          PYTHONPATH: src
        run: |
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          python -m forexpro_ri.cli memory ingest examples/closed_synthetic --db "$tmpdir/memory.sqlite" --unsigned-synthetic
          python -m forexpro_ri.cli memory ingest examples/closed_synthetic_peer --db "$tmpdir/memory.sqlite" --unsigned-synthetic
          python -m forexpro_ri.cli memory dossier --db "$tmpdir/memory.sqlite" --focus SYNTHETIC-001 --expected-procedure MONTE_CARLO --format json
          python -m forexpro_ri.cli memory dossier --db "$tmpdir/memory.sqlite" --focus SYNTHETIC-001 --expected-procedure MONTE_CARLO --format markdown
          python -m forexpro_ri.cli memory verify --db "$tmpdir/memory.sqlite"

      - name: Historical signed provenance and audit gate (v0.9)
        env:
          PYTHONPATH: src
        run: |
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          python -m forexpro_ri.cli memory ingest examples/closed_synthetic --db "$tmpdir/memory.sqlite" --unsigned-synthetic
          python -m forexpro_ri.cli memory audit --db "$tmpdir/memory.sqlite"
          if python -m forexpro_ri.cli memory audit --db "$tmpdir/memory.sqlite" --require-signed; then
            echo 'ERROR: unsigned fixture passed signed intake gate' >&2
            exit 1
          fi
          python -m forexpro_ri.cli memory migrate --db "$tmpdir/memory.sqlite"
          python -m forexpro_ri.cli memory verify --db "$tmpdir/memory.sqlite"
          python -m forexpro_ri.cli bridge rehearsal

      - name: Synthetic-only operational pipeline (v1.0)
        env:
          PYTHONPATH: src
        run: |
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          python -m forexpro_ri.cli operations run \
            --bundle examples/closed_synthetic \
            --bundle examples/closed_synthetic_peer \
            --db "$tmpdir/memory.sqlite" --out "$tmpdir/report" \
            --unsigned-synthetic --expected-procedure MONTE_CARLO
          python -m forexpro_ri.cli operations readiness \
            --db "$tmpdir/memory.sqlite" --allow-unsigned-synthetic
          if python -m forexpro_ri.cli operations readiness --db "$tmpdir/memory.sqlite"; then
            echo 'ERROR: synthetic history passed signed-only readiness' >&2
            exit 1
          fi
          python -m forexpro_ri.cli operations verify-report --dir "$tmpdir/report"
          test -f "$tmpdir/report/run.json"
          test -f "$tmpdir/report/intake.json"

      - name: Synthetic-only Research Memory recovery drill (v1.1)
        env:
          PYTHONPATH: src
        run: |
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          python -m forexpro_ri.cli memory ingest examples/closed_synthetic \
            --db "$tmpdir/live.sqlite" --unsigned-synthetic
          python -m forexpro_ri.cli recovery backup \
            --db "$tmpdir/live.sqlite" --out "$tmpdir/snapshot"
          python -m forexpro_ri.cli recovery verify --dir "$tmpdir/snapshot"
          python -m forexpro_ri.cli recovery restore \
            --dir "$tmpdir/snapshot" --db "$tmpdir/restored.sqlite"
          python -m forexpro_ri.cli recovery drill --db "$tmpdir/restored.sqlite"
          python -m forexpro_ri.cli memory audit --db "$tmpdir/restored.sqlite"
          if python -m forexpro_ri.cli recovery restore \
            --dir "$tmpdir/snapshot" --db "$tmpdir/live.sqlite"; then
            echo 'ERROR: recovery overwrote a live database' >&2
            exit 1
          fi

      - name: Synthetic-only offline durable jobs v2.0
        env:
          PYTHONPATH: src
        run: |
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          mkdir -p "$tmpdir/reports"
          python -m forexpro_ri.cli jobs submit \
            --queue "$tmpdir/jobs.sqlite" --db "$tmpdir/memory.sqlite" \
            --out-root "$tmpdir/reports" \
            --bundle examples/closed_synthetic \
            --bundle examples/closed_synthetic_peer --unsigned-synthetic
          python -m forexpro_ri.cli jobs work --queue "$tmpdir/jobs.sqlite"
          python -m forexpro_ri.cli jobs verify --queue "$tmpdir/jobs.sqlite"
          python -m forexpro_ri.cli jobs health --queue "$tmpdir/jobs.sqlite" \
            --db "$tmpdir/memory.sqlite" --allow-unsigned-synthetic
          python -m forexpro_ri.cli bridge fixture \
            --bundle "$tmpdir/signed" --trust-store "$tmpdir/keys.json"
          python -m forexpro_ri.cli jobs submit \
            --queue "$tmpdir/signed-jobs.sqlite" --db "$tmpdir/signed-memory.sqlite" \
            --out-root "$tmpdir/reports" \
            --bundle "$tmpdir/signed" --trust-store "$tmpdir/keys.json"
          python -m forexpro_ri.cli jobs work --queue "$tmpdir/signed-jobs.sqlite"
          python -m forexpro_ri.cli jobs verify --queue "$tmpdir/signed-jobs.sqlite"
          python -m forexpro_ri.cli jobs health --queue "$tmpdir/signed-jobs.sqlite" \
            --db "$tmpdir/signed-memory.sqlite"

      - name: Synthetic-only v2.1 queue drift and v2.2 research program
        env:
          PYTHONPATH: src
        run: |
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          mkdir -p "$tmpdir/reports"
          python -m forexpro_ri.cli jobs submit \
            --queue "$tmpdir/jobs.sqlite" --db "$tmpdir/memory.sqlite" \
            --out-root "$tmpdir/reports" \
            --bundle examples/closed_synthetic \
            --bundle examples/closed_synthetic_peer --unsigned-synthetic
          python -m forexpro_ri.cli jobs watch \
            --queue "$tmpdir/jobs.sqlite" --inspect-sources
          python -m forexpro_ri.cli jobs work --queue "$tmpdir/jobs.sqlite"
          python -m forexpro_ri.cli jobs verify --queue "$tmpdir/jobs.sqlite"
          python -m forexpro_ri.cli memory program --db "$tmpdir/memory.sqlite" \
            --allow-unsigned-synthetic --expected-procedure RISK_LIMITS --format markdown
          if python -m forexpro_ri.cli memory program --db "$tmpdir/memory.sqlite"; then
            echo 'ERROR: unsigned research history passed signed-only program gate' >&2
            exit 1
          fi
          python -m forexpro_ri.cli bridge fixture \
            --bundle "$tmpdir/signed" --trust-store "$tmpdir/keys.json"
          python -m forexpro_ri.cli jobs submit \
            --queue "$tmpdir/signed-jobs.sqlite" --db "$tmpdir/signed-memory.sqlite" \
            --out-root "$tmpdir/reports" \
            --bundle "$tmpdir/signed" --trust-store "$tmpdir/keys.json"
          python -m forexpro_ri.cli jobs work --queue "$tmpdir/signed-jobs.sqlite"
          python -m forexpro_ri.cli memory program --db "$tmpdir/signed-memory.sqlite"

      - name: Synthetic-only Research Advisor v2.4 (no model network)
        env:
          PYTHONPATH: src
        run: |
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          python -m forexpro_ri.cli memory ingest examples/closed_synthetic \
            --db "$tmpdir/research.sqlite" --unsigned-synthetic
          python -m forexpro_ri.cli memory ingest examples/closed_synthetic_peer \
            --db "$tmpdir/research.sqlite" --unsigned-synthetic
          python -m forexpro_ri.cli advisor --db "$tmpdir/research.sqlite" \
            --unsigned-synthetic --expected-procedure MONTE_CARLO \
            --format json --out "$tmpdir/advisor.json"
          python -m forexpro_ri.cli advisor --db "$tmpdir/research.sqlite" \
            --unsigned-synthetic --expected-procedure MONTE_CARLO --format markdown
          if python -m forexpro_ri.cli advisor --db "$tmpdir/research.sqlite"; then
            echo 'ERROR: unsigned data passed signed-only advisor gate' >&2
            exit 1
          fi
          python -m forexpro_ri.cli bridge fixture \
            --bundle "$tmpdir/signed" --trust-store "$tmpdir/trust.json"
          python -m forexpro_ri.cli memory ingest "$tmpdir/signed" \
            --db "$tmpdir/signed-memory.sqlite" --trust-store "$tmpdir/trust.json"
          python -m forexpro_ri.cli advisor --db "$tmpdir/signed-memory.sqlite" \
            --format json --out "$tmpdir/signed-advisor.json"

      - name: v2.6 signed synthetic contract rehearsal
        env:
          PYTHONPATH: src
        run: python -m forexpro_ri.cli integration rehearsal

      - name: v2.5 quality benchmark on signed synthetic memory
        env:
          PYTHONPATH: src
        run: |
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          python -m forexpro_ri.cli bridge fixture --bundle "$tmpdir/signed" --trust-store "$tmpdir/keys.json"
          python -m forexpro_ri.cli memory ingest "$tmpdir/signed" --db "$tmpdir/memory.sqlite" --trust-store "$tmpdir/keys.json"
          python -m forexpro_ri.cli quality benchmark --db "$tmpdir/memory.sqlite"


      - name: Issue 19 offline Research Review Pack full synthetic acceptance
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          python -m forexpro_ri.cli review cohort-demo --out "$tmpdir/cohort"
          python -m forexpro_ri.cli review verify --dir "$tmpdir/cohort"
          python -m forexpro_ri.cli review audit --dir "$tmpdir/cohort"
          python -m forexpro_ri.cli review benchmark \
            --dir "$tmpdir/cohort" --labels examples/review_cohort_gold.json
          python -m forexpro_ri.cli review recall \
            --dir "$tmpdir/cohort" --labels examples/review_question_recall_gold.json
          python -m forexpro_ri.cli review study \
            --input examples/review_time_study_synthetic.json
          python -m forexpro_ri.cli review decision-template \
            --dir "$tmpdir/cohort" --out "$tmpdir/decision-input.json"
          python -m forexpro_ri.cli review decisions \
            --dir "$tmpdir/cohort" --input "$tmpdir/decision-input.json" \
            --out "$tmpdir/decisions.json"
          python -m forexpro_ri.cli review compare \
            --before "$tmpdir/cohort" --after "$tmpdir/cohort" \
            --out "$tmpdir/unchanged.json"
          python -m forexpro_ri.cli review demo --out "$tmpdir/one"
          python -m forexpro_ri.cli review verify --dir "$tmpdir/one"
          if python -m forexpro_ri.cli review compare \
            --before "$tmpdir/cohort" --after "$tmpdir/one" \
            --out "$tmpdir/invalid.json"; then
            echo "FAIL: append-only comparison accepted missing cases" >&2
            exit 1
          fi


      - name: Issue 19 evidence-first triage and two-reviewer negative rehearsal
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          python -m forexpro_ri.cli review cohort-demo --out "$tmpdir/pack"
          python -m forexpro_ri.cli review verify --dir "$tmpdir/pack"
          python -m forexpro_ri.cli review triage --dir "$tmpdir/pack"
          python -m forexpro_ri.cli review repetition --dir "$tmpdir/pack"
          python -m forexpro_ri.cli review decision-template \
            --dir "$tmpdir/pack" --out "$tmpdir/reviewer-a.json"
          python -m forexpro_ri.cli review decision-template \
            --dir "$tmpdir/pack" --out "$tmpdir/reviewer-b.json"
          python - "$tmpdir/reviewer-b.json" <<'PY'
          import json
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          data = json.loads(path.read_text(encoding="utf-8"))
          data["decisions"][0].update({
              "choice": "ACCEPT_FOR_DISCUSSION",
              "reason_code": "NEW_EXPERIMENT_QUESTION",
          })
          path.write_text(json.dumps(data, sort_keys=True), encoding="utf-8")
          PY
          python -m forexpro_ri.cli review decisions \
            --dir "$tmpdir/pack" --input "$tmpdir/reviewer-a.json" \
            --out "$tmpdir/checked-a.json"
          python -m forexpro_ri.cli review decisions \
            --dir "$tmpdir/pack" --input "$tmpdir/reviewer-b.json" \
            --out "$tmpdir/checked-b.json"
          python -m forexpro_ri.cli review agreement \
            --dir "$tmpdir/pack" --left "$tmpdir/checked-a.json" \
            --right "$tmpdir/checked-b.json" \
            --out "$tmpdir/disagreement.json"
          if python -m forexpro_ri.cli review agreement \
            --dir "$tmpdir/pack" --left "$tmpdir/checked-a.json" \
            --right "$tmpdir/checked-a.json" \
            --out "$tmpdir/false-independence.json"; then
            echo "FAIL: identical reviewer sidecars claimed independent review" >&2
            exit 1
          fi


      - name: Issue 19 private curator rubric and counterbalanced study E2E
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          python -m forexpro_ri.cli review demo --out "$tmpdir/pack"
          python -m forexpro_ri.cli review verify --dir "$tmpdir/pack"
          python -m forexpro_ri.cli review rubric-template \
            --dir "$tmpdir/pack" --out "$tmpdir/rubric-a.json"
          python -m forexpro_ri.cli review rubric-template \
            --dir "$tmpdir/pack" --out "$tmpdir/rubric-b.json"
          python -m forexpro_ri.cli review study-plan \
            --dir "$tmpdir/pack" --tasks 20 --out "$tmpdir/study-plan.json"
          python - "$tmpdir" <<'PY'
          import json
          import sys
          from pathlib import Path
          root = Path(sys.argv[1])
          for name in ("rubric-a.json", "rubric-b.json"):
              p = root / name
              x = json.loads(p.read_text(encoding="utf-8"))
              for row in x["items"]:
                  row.update({
                      "grounding": "SUPPORTED_BY_RECORDED_EVIDENCE",
                      "usefulness": "USEFUL_RESEARCH_QUESTION",
                      "duplication": "NOT_IDENTIFIED_IN_REVIEWED_CORPUS",
                      "scientific_language": "BOUNDED_ADVISORY_ONLY",
                  })
              if name == "rubric-b.json":
                  x["items"][0]["grounding"] = "UNSUPPORTED_BY_RECORDED_EVIDENCE"
              p.write_text(json.dumps(x, sort_keys=True), encoding="utf-8")
          plan = json.loads((root / "study-plan.json").read_text(encoding="utf-8"))
          data = {
              "schema_version": 1, "source_class": "CURATED_SYNTHETIC_ONLY",
              "tasks": [{
                  "task_id": row["task_id"], "order": row["order"],
                  "manual_seconds": 300, "fri_seconds": 60,
                  "manual_correct": True, "fri_correct": True,
                  "manual_citations_correct": True,
                  "fri_citations_correct": True,
                  "manual_independence_error": False,
                  "fri_independence_error": False,
              } for row in plan["assignments"]],
          }
          (root / "synthetic-times.json").write_text(
              json.dumps(data, sort_keys=True), encoding="utf-8"
          )
          PY
          python -m forexpro_ri.cli review rubric-score \
            --dir "$tmpdir/pack" --input "$tmpdir/rubric-a.json" \
            --out "$tmpdir/checked-a.json"
          python -m forexpro_ri.cli review rubric-score \
            --dir "$tmpdir/pack" --input "$tmpdir/rubric-b.json" \
            --out "$tmpdir/checked-b.json"
          python -m forexpro_ri.cli review rubric-compare \
            --dir "$tmpdir/pack" --left "$tmpdir/checked-a.json" \
            --right "$tmpdir/checked-b.json" \
            --out "$tmpdir/curator-differences.json"
          python -m forexpro_ri.cli review decision-template \
            --dir "$tmpdir/pack" --out "$tmpdir/discussion-input.json"
          python - "$tmpdir/discussion-input.json" <<'PY'
          import json
          import sys
          from pathlib import Path
          p = Path(sys.argv[1])
          report = json.loads(p.read_text(encoding="utf-8"))
          report["decisions"][0].update({
              "choice": "ACCEPT_FOR_DISCUSSION",
              "reason_code": "NEW_EXPERIMENT_QUESTION",
          })
          p.write_text(json.dumps(report), encoding="utf-8")
          PY
          python -m forexpro_ri.cli review decisions \
            --dir "$tmpdir/pack" --input "$tmpdir/discussion-input.json" \
            --out "$tmpdir/discussion.json"
          python -m forexpro_ri.cli review reconcile-human \
            --dir "$tmpdir/pack" --decisions "$tmpdir/discussion.json" \
            --rubric "$tmpdir/checked-b.json" \
            --out "$tmpdir/reconciled.json"
          python - "$tmpdir/reconciled.json" <<'PY'
          import json
          import sys
          from pathlib import Path
          result = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert result["questions_requiring_reconciliation"] == 1
          assert result["status"] == "HUMAN_RECONCILIATION_REQUIRED"
          assert result["scientific_authority"] is False
          PY
          python -m forexpro_ri.cli review study-reconcile \
            --dir "$tmpdir/pack" --plan "$tmpdir/study-plan.json" \
            --input "$tmpdir/synthetic-times.json" \
            --out "$tmpdir/study-results.json"
          if python -m forexpro_ri.cli review rubric-compare \
            --dir "$tmpdir/pack" --left "$tmpdir/checked-a.json" \
            --right "$tmpdir/checked-a.json" \
            --out "$tmpdir/false-two-reviewers.json"; then
            echo "FAIL: identical curator files accepted as separate reviews" >&2
            exit 1
          fi
          python - "$tmpdir/study-results.json" <<'PY'
          import json
          import sys
          from pathlib import Path
          result = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert result["all_task_orders_match_assignment"] is True
          assert result["real_world_100x_confirmed"] is False
          assert result["scientific_authority"] is False
          PY
