name: Public-safe CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install FRI and Ed25519 verification dependency
        run: python -m pip install -e .
      - name: Synthetic-only unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Synthetic-only example CLI
        env:
          PYTHONPATH: src
        run: python -m forexpro_ri.cli examples/closed_synthetic
      - name: Synthetic-only Research Memory lifecycle
        env:
          PYTHONPATH: src
        run: |
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          python -m forexpro_ri.cli memory ingest examples/closed_synthetic --db "$tmpdir/memory.sqlite" --unsigned-synthetic
          python -m forexpro_ri.cli memory patterns --db "$tmpdir/memory.sqlite"
          python -m forexpro_ri.cli memory verify --db "$tmpdir/memory.sqlite"
      - name: Synthetic-only Failure Intelligence smoke
        env:
          PYTHONPATH: src
        run: |
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          python -m forexpro_ri.cli memory ingest examples/closed_synthetic --db "$tmpdir/memory.sqlite" --unsigned-synthetic
          python -m forexpro_ri.cli memory intelligence --db "$tmpdir/memory.sqlite" --focus SYNTHETIC-001

      - name: Synthetic-only signed bridge E2E rehearsal
        env:
          PYTHONPATH: src
        run: python -m forexpro_ri.cli bridge rehearsal

      - name: Synthetic-only cohort comparison CLI (v0.6)
        env:
          PYTHONPATH: src
        run: |
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          python -m forexpro_ri.cli memory ingest examples/closed_synthetic --db "$tmpdir/memory.sqlite" --unsigned-synthetic
          python -m forexpro_ri.cli memory ingest examples/closed_synthetic_peer --db "$tmpdir/memory.sqlite" --unsigned-synthetic
          python -m forexpro_ri.cli memory compare --db "$tmpdir/memory.sqlite" --experiment SYNTHETIC-001 --experiment SYNTHETIC-002 --expected-procedure REGIME_STABILITY --format json
          python -m forexpro_ri.cli memory compare --db "$tmpdir/memory.sqlite" --experiment SYNTHETIC-002 --experiment SYNTHETIC-001 --expected-procedure REGIME_STABILITY --format markdown
          python -m forexpro_ri.cli memory verify --db "$tmpdir/memory.sqlite"

      - name: Synthetic-only Research Dossier (v0.7)
        env:
          PYTHONPATH: src
        run: |
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          python -m forexpro_ri.cli memory ingest examples/closed_synthetic --db "$tmpdir/memory.sqlite" --unsigned-synthetic
          python -m forexpro_ri.cli memory ingest examples/closed_synthetic_peer --db "$tmpdir/memory.sqlite" --unsigned-synthetic
          python -m forexpro_ri.cli memory dossier --db "$tmpdir/memory.sqlite" --focus SYNTHETIC-001 --expected-procedure MONTE_CARLO --format json
          python -m forexpro_ri.cli memory dossier --db "$tmpdir/memory.sqlite" --focus SYNTHETIC-001 --expected-procedure MONTE_CARLO --format markdown
          python -m forexpro_ri.cli memory verify --db "$tmpdir/memory.sqlite"

      - name: Historical signed provenance and audit gate (v0.9)
        env:
          PYTHONPATH: src
        run: |
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          python -m forexpro_ri.cli memory ingest examples/closed_synthetic --db "$tmpdir/memory.sqlite" --unsigned-synthetic
          python -m forexpro_ri.cli memory audit --db "$tmpdir/memory.sqlite"
          if python -m forexpro_ri.cli memory audit --db "$tmpdir/memory.sqlite" --require-signed; then
            echo 'ERROR: unsigned fixture passed signed intake gate' >&2
            exit 1
          fi
          python -m forexpro_ri.cli memory migrate --db "$tmpdir/memory.sqlite"
          python -m forexpro_ri.cli memory verify --db "$tmpdir/memory.sqlite"
          python -m forexpro_ri.cli bridge rehearsal

      - name: Synthetic-only operational pipeline (v1.0)
        env:
          PYTHONPATH: src
        run: |
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          python -m forexpro_ri.cli operations run \
            --bundle examples/closed_synthetic \
            --bundle examples/closed_synthetic_peer \
            --db "$tmpdir/memory.sqlite" --out "$tmpdir/report" \
            --unsigned-synthetic --expected-procedure MONTE_CARLO
          python -m forexpro_ri.cli operations readiness \
            --db "$tmpdir/memory.sqlite" --allow-unsigned-synthetic
          if python -m forexpro_ri.cli operations readiness --db "$tmpdir/memory.sqlite"; then
            echo 'ERROR: synthetic history passed signed-only readiness' >&2
            exit 1
          fi
          python -m forexpro_ri.cli operations verify-report --dir "$tmpdir/report"
          test -f "$tmpdir/report/run.json"
          test -f "$tmpdir/report/intake.json"

      - name: Synthetic-only Research Memory recovery drill (v1.1)
        env:
          PYTHONPATH: src
        run: |
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          python -m forexpro_ri.cli memory ingest examples/closed_synthetic \
            --db "$tmpdir/live.sqlite" --unsigned-synthetic
          python -m forexpro_ri.cli recovery backup \
            --db "$tmpdir/live.sqlite" --out "$tmpdir/snapshot"
          python -m forexpro_ri.cli recovery verify --dir "$tmpdir/snapshot"
          python -m forexpro_ri.cli recovery restore \
            --dir "$tmpdir/snapshot" --db "$tmpdir/restored.sqlite"
          python -m forexpro_ri.cli recovery drill --db "$tmpdir/restored.sqlite"
          python -m forexpro_ri.cli memory audit --db "$tmpdir/restored.sqlite"
          if python -m forexpro_ri.cli recovery restore \
            --dir "$tmpdir/snapshot" --db "$tmpdir/live.sqlite"; then
            echo 'ERROR: recovery overwrote a live database' >&2
            exit 1
          fi

      - name: Synthetic-only offline durable jobs v2.0
        env:
          PYTHONPATH: src
        run: |
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          mkdir -p "$tmpdir/reports"
          python -m forexpro_ri.cli jobs submit \
            --queue "$tmpdir/jobs.sqlite" --db "$tmpdir/memory.sqlite" \
            --out-root "$tmpdir/reports" \
            --bundle examples/closed_synthetic \
            --bundle examples/closed_synthetic_peer --unsigned-synthetic
          python -m forexpro_ri.cli jobs work --queue "$tmpdir/jobs.sqlite"
          python -m forexpro_ri.cli jobs verify --queue "$tmpdir/jobs.sqlite"
          python -m forexpro_ri.cli jobs health --queue "$tmpdir/jobs.sqlite" \
            --db "$tmpdir/memory.sqlite" --allow-unsigned-synthetic
          python -m forexpro_ri.cli bridge fixture \
            --bundle "$tmpdir/signed" --trust-store "$tmpdir/keys.json"
          python -m forexpro_ri.cli jobs submit \
            --queue "$tmpdir/signed-jobs.sqlite" --db "$tmpdir/signed-memory.sqlite" \
            --out-root "$tmpdir/reports" \
            --bundle "$tmpdir/signed" --trust-store "$tmpdir/keys.json"
          python -m forexpro_ri.cli jobs work --queue "$tmpdir/signed-jobs.sqlite"
          python -m forexpro_ri.cli jobs verify --queue "$tmpdir/signed-jobs.sqlite"
          python -m forexpro_ri.cli jobs health --queue "$tmpdir/signed-jobs.sqlite" \
            --db "$tmpdir/signed-memory.sqlite"

      - name: Synthetic-only v2.1 queue drift and v2.2 research program
        env:
          PYTHONPATH: src
        run: |
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          mkdir -p "$tmpdir/reports"
          python -m forexpro_ri.cli jobs submit \
            --queue "$tmpdir/jobs.sqlite" --db "$tmpdir/memory.sqlite" \
            --out-root "$tmpdir/reports" \
            --bundle examples/closed_synthetic \
            --bundle examples/closed_synthetic_peer --unsigned-synthetic
          python -m forexpro_ri.cli jobs watch \
            --queue "$tmpdir/jobs.sqlite" --inspect-sources
          python -m forexpro_ri.cli jobs work --queue "$tmpdir/jobs.sqlite"
          python -m forexpro_ri.cli jobs verify --queue "$tmpdir/jobs.sqlite"
          python -m forexpro_ri.cli memory program --db "$tmpdir/memory.sqlite" \
            --allow-unsigned-synthetic --expected-procedure RISK_LIMITS --format markdown
          if python -m forexpro_ri.cli memory program --db "$tmpdir/memory.sqlite"; then
            echo 'ERROR: unsigned research history passed signed-only program gate' >&2
            exit 1
          fi
          python -m forexpro_ri.cli bridge fixture \
            --bundle "$tmpdir/signed" --trust-store "$tmpdir/keys.json"
          python -m forexpro_ri.cli jobs submit \
            --queue "$tmpdir/signed-jobs.sqlite" --db "$tmpdir/signed-memory.sqlite" \
            --out-root "$tmpdir/reports" \
            --bundle "$tmpdir/signed" --trust-store "$tmpdir/keys.json"
          python -m forexpro_ri.cli jobs work --queue "$tmpdir/signed-jobs.sqlite"
          python -m forexpro_ri.cli memory program --db "$tmpdir/signed-memory.sqlite"

      - name: Synthetic-only Research Advisor v2.4 (no model network)
        env:
          PYTHONPATH: src
        run: |
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          python -m forexpro_ri.cli memory ingest examples/closed_synthetic \
            --db "$tmpdir/research.sqlite" --unsigned-synthetic
          python -m forexpro_ri.cli memory ingest examples/closed_synthetic_peer \
            --db "$tmpdir/research.sqlite" --unsigned-synthetic
          python -m forexpro_ri.cli advisor --db "$tmpdir/research.sqlite" \
            --unsigned-synthetic --expected-procedure MONTE_CARLO \
            --format json --out "$tmpdir/advisor.json"
          python -m forexpro_ri.cli advisor --db "$tmpdir/research.sqlite" \
            --unsigned-synthetic --expected-procedure MONTE_CARLO --format markdown
          if python -m forexpro_ri.cli advisor --db "$tmpdir/research.sqlite"; then
            echo 'ERROR: unsigned data passed signed-only advisor gate' >&2
            exit 1
          fi
          python -m forexpro_ri.cli bridge fixture \
            --bundle "$tmpdir/signed" --trust-store "$tmpdir/trust.json"
          python -m forexpro_ri.cli memory ingest "$tmpdir/signed" \
            --db "$tmpdir/signed-memory.sqlite" --trust-store "$tmpdir/trust.json"
          python -m forexpro_ri.cli advisor --db "$tmpdir/signed-memory.sqlite" \
            --format json --out "$tmpdir/signed-advisor.json"

